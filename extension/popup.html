<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HumanProof 기여 기록</title><link rel="stylesheet" href="popup.css"><script src="records.js" defer></script><script src="popup.js" defer></script></head>
<body>
  <h1>HumanProof 기여 기록</h1>
  <p>내가 수행한 작업의 근거를 저장합니다. 페이지 읽기는 아래 버튼을 눌렀을 때 실행됩니다.</p>
  <button id="capture" type="button">현재 페이지 정보 가져오기</button>
  <form id="recordForm">
    <label>기여 유형<select id="actorType"><option value="HUMAN">인간 기여</option><option value="AI">AI 활용 신고</option></select></label>
    <label>단계<select id="stage"><option value="idea">아이디어</option><option value="draft">초안</option><option value="verification">자료 검증</option><option value="revision">수정</option></select></label>
    <label>작업 설명<textarea id="note" required maxlength="2000" placeholder="직접 확인하거나 수정한 내용과 이유"></textarea></label>
    <label>페이지 제목<input id="pageTitle" maxlength="300"></label>
    <label>근거 URL<input id="sourceUrl" type="url" maxlength="2000" placeholder="https://..."></label>
    <label class="check"><input id="includeSelection" type="checkbox">선택한 텍스트도 가져오기 (최대 5,000자)</label>
    <label>선택 텍스트<textarea id="selectedText" maxlength="5000"></textarea></label>
    <p>주소의 검색어와 # 부분은 제거됩니다. 경로·제목·선택 텍스트에 남은 개인정보는 저장 전에 삭제하세요. 외부 서버로 전송하지 않습니다.</p>
    <button type="submit">확인한 기록 저장</button>
  </form>
  <div id="status" role="status" aria-live="polite"></div>
  <h2>저장 기록 <span id="count">0</span> / 100</h2>
  <div id="records"></div>
  <button id="export" type="button">JSON 내보내기</button>
  <label class="check"><input id="confirmDelete" type="checkbox">내보낸 파일을 확인했고 전체 삭제에 동의합니다</label>
  <button id="clear" type="button" disabled>저장 기록 전체 삭제</button>
  <p>이 기록은 작성자 신고입니다. AI 사용의 완전성이나 인간 승인을 증명하지 않습니다. HumanProof의 버전 · 이력에서 JSON을 가져오세요.</p>
</body></html>
